---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: {{ include "odoo.ns" . }}
  labels:
    app: odoo
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
      component: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: odoo
        component: web
    spec:
      {{- if .Values.odoo.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.odoo.podSecurityContext | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.odoo.initContainer.image }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z db 5432; do
                echo "PostgreSQL is not ready yet - sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: render-odoo-conf
          # Combines the non-secret odoo.conf (ConfigMap) with admin_passwd
          # (Secret) into one file on an emptyDir, so admin_passwd never sits
          # in a ConfigMap and never appears in `kubectl get configmap -o yaml`.
          image: {{ .Values.odoo.initContainer.image }}
          command:
            - sh
            - -c
            - |
              set -e
              cp /template/odoo.conf /rendered/odoo.conf
              printf '\nadmin_passwd = %s\n' "$ADMIN_PASSWD" >> /rendered/odoo.conf
              echo "Rendered /rendered/odoo.conf (admin_passwd from Secret odoo-secrets)"
          env:
            - name: ADMIN_PASSWD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: ADMIN_PASSWD
          volumeMounts:
            - name: odoo-config-template
              mountPath: /template/odoo.conf
              subPath: odoo.conf
              readOnly: true
            - name: odoo-config-rendered
              mountPath: /rendered
      containers:
        - name: odoo
          image: "{{ .Values.odoo.image.repository }}:{{ .Values.odoo.image.tag }}"
          imagePullPolicy: {{ .Values.odoo.image.pullPolicy }}
          ports:
            - containerPort: 8069
              name: http
              protocol: TCP
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: PORT
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: odoo-db-secret
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: odoo-web-data
              mountPath: /var/lib/odoo
            - name: odoo-addons
              mountPath: /mnt/extra-addons
            - name: odoo-config-rendered
              mountPath: /etc/odoo
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
      restartPolicy: Always
      volumes:
        - name: odoo-web-data
          persistentVolumeClaim:
            claimName: odoo-web-data
        - name: odoo-addons
          persistentVolumeClaim:
            claimName: odoo-addons
        - name: odoo-config-template
          configMap:
            name: odoo-config
            items:
              - key: odoo.conf
                path: odoo.conf
        - name: odoo-config-rendered
          emptyDir: {}
