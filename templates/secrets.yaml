{{- /*
Secrets, rendered only with secrets.create=true. By default (create=false)
they already exist out of band (see examples/secrets.example.yaml) and this
chart never touches them, so an upgrade cannot overwrite a real password.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: odoo-db-secret
  namespace: {{ include "odoo.ns" . }}
  labels:
    app: odoo
    component: database
  {{- include "odoo.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $s.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" $s.postgresPassword | quote }}
  POSTGRES_DB: {{ $s.postgresDb | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: odoo-secrets
  namespace: {{ include "odoo.ns" . }}
  labels:
    app: odoo
    component: web
  {{- include "odoo.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  # Odoo's database-manager master password (odoo.conf's admin_passwd).
  # An initContainer appends it to the rendered odoo.conf; never in a ConfigMap.
  ADMIN_PASSWD: {{ required "secrets.adminPasswd is required when secrets.create=true" $s.adminPasswd | quote }}
{{- end }}
