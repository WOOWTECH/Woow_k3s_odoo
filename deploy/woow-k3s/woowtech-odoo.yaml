# Instance values for the woowtech-odoo Odoo tenant on woow-k3s.
# Generated from the live objects: the render reproduces the running pod
# templates exactly, so adopting them restarts nothing.
#
# The init containers below are this tenant's own provisioning script,
# carried verbatim. Do not regenerate or 'tidy' them.
#
# SAFETY: never set `namespace:` here - placement is `-n` only.

tenant: woowtech

odoo:
  containerName: odoo
  replicas: 0
  strategy: Recreate
  image: odoo:18.0
  imagePullPolicy: IfNotPresent
  # IMMUTABLE on the live Deployment.
  selectorLabels:
    app: woowtech-odoo
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: '2026-08-25T09:26:56+08:00'
  podSecurityContext:
    fsGroup: 101
  # Verbatim - this tenant's provisioning script.
  initContainers:
    - command:
      - sh
      - -c
      - chown -R 101:101 /var/lib/odoo
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      name: fix-perms
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsUser: 0
      volumeMounts:
      - mountPath: /var/lib/odoo
        name: data
    - command:
      - sh
      - -c
      - until nc -z woowtech-postgres-svc 5432; do sleep 2; done
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      name: wait-pg
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
    - args:
      - 'cat /scripts/install.sh | sh
    
        '
      command:
      - sh
      - -c
      image: odoo:18.0
      imagePullPolicy: IfNotPresent
      name: install-pip-deps
      resources:
        limits:
          cpu: '1'
          memory: 1Gi
      securityContext:
        runAsUser: 0
      volumeMounts:
      - mountPath: /mnt/extra-addons
        name: addons
      - mountPath: /scripts
        name: pip-scripts
      - mountPath: /usr/local/lib/python3.12/dist-packages
        name: pip-packages
  command:
    - bash
    - -c
    - cp /etc/odoo/odoo.conf /tmp/odoo.conf && sed -i "s|db_password = .*|db_password = $PASSWORD|" /tmp/odoo.conf && sed -i "s|admin_passwd = .*|admin_passwd = $ADMIN_PASSWORD|" /tmp/odoo.conf && sed -i "s|smtp_password = .*|smtp_password = $SMTP_PASSWORD|" /tmp/odoo.conf && exec odoo --config=/tmp/odoo.conf
  env:
    - name: HOST
      value: woowtech-postgres-svc
    - name: PORT
      value: '5432'
    - name: USER
      valueFrom:
        secretKeyRef:
          key: POSTGRES_USER
          name: woowtech-postgres-secret
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          key: POSTGRES_PASSWORD
          name: woowtech-postgres-secret
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          key: ADMIN_PASSWORD
          name: woowtech-postgres-secret
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          key: SMTP_PASSWORD
          name: woowtech-postgres-secret
    - name: PIP_BREAK_SYSTEM_PACKAGES
      value: '1'
  ports:
    - containerPort: 8069
      name: http
      protocol: TCP
    - containerPort: 8072
      name: lp
      protocol: TCP
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    initialDelaySeconds: 180
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 60
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 1
  resources:
    limits:
      cpu: '4'
      memory: 6Gi
    requests:
      cpu: '1'
      memory: 2Gi
  volumeMounts:
    - mountPath: /var/lib/odoo
      name: data
    - mountPath: /mnt/extra-addons
      name: addons
    - mountPath: /etc/odoo/odoo.conf
      name: config
      readOnly: true
      subPath: odoo.conf
    - mountPath: /usr/local/lib/python3.12/dist-packages
      name: pip-packages
  # Verbatim: order is part of the pod template.
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: woowtech-odoo-data
    - name: addons
      persistentVolumeClaim:
        claimName: woowtech-odoo-addons
    - configMap:
        defaultMode: 420
        name: woowtech-odoo-config
      name: config
    - configMap:
        defaultMode: 420
        name: woowtech-nginx-config
      name: nginx-conf
    - name: cache
      persistentVolumeClaim:
        claimName: woowtech-nginx-cache
    - configMap:
        defaultMode: 420
        name: woowtech-pip-deps
      name: pip-scripts
    - emptyDir:
        sizeLimit: 500Mi
      name: pip-packages
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8069
        protocol: TCP
        targetPort: 8069
      - name: lp
        port: 8072
        protocol: TCP
        targetPort: 8072
      - name: nginx
        port: 8080
        protocol: TCP
        targetPort: 8080

nginx:
  enabled: true
  containerName: nginx
  image: nginx:1.27-alpine
  imagePullPolicy: IfNotPresent
  ports:
    - containerPort: 8080
      protocol: TCP
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  volumeMounts:
    - mountPath: /etc/nginx/nginx.conf
      name: nginx-conf
      readOnly: true
      subPath: nginx.conf
    - mountPath: /var/cache/nginx
      name: cache

postgres:
  enabled: true
  containerName: postgres
  replicas: 1
  strategy: Recreate
  image: pgvector/pgvector:pg17
  imagePullPolicy: IfNotPresent
  selectorLabels:
    app: woowtech-postgres
  nodeSelector:
    kubernetes.io/hostname: ubuntuserver-z0v3w
  env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          key: POSTGRES_USER
          name: woowtech-postgres-secret
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          key: POSTGRES_PASSWORD
          name: woowtech-postgres-secret
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          key: POSTGRES_DB
          name: woowtech-postgres-secret
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  ports:
    - containerPort: 5432
      protocol: TCP
  livenessProbe:
    exec:
      command:
      - pg_isready
      - -U
      - woow-odoo
      - -d
      - odoo
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command:
      - pg_isready
      - -U
      - woow-odoo
      - -d
      - odoo
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1
  resources:
    limits:
      cpu: '2'
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: data
    - mountPath: /docker-entrypoint-initdb.d
      name: initdb
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: woowtech-db-pvc
    - configMap:
        defaultMode: 420
        name: postgres-initdb
      name: initdb
  service:
    type: ClusterIP
    ports:
      - port: 5432
        protocol: TCP
        targetPort: 5432

tunnel:
  enabled: true
  containerName: cloudflared
  replicas: 1
  image: cloudflare/cloudflared:latest
  imagePullPolicy: Always
  selectorLabels:
    app: woowtech-cloudflared
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: '2026-06-25T19:42:56+08:00'
  nodeSelector:
    node-role.kubernetes.io/control-plane: 'true'
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  args:
    - tunnel
    - --no-autoupdate
    - --metrics
    - 0.0.0.0:2000
    - run
    - --token
    - $(TUNNEL_TOKEN)
  env:
    - name: TUNNEL_TOKEN
      valueFrom:
        secretKeyRef:
          key: CF_TUNNEL_TOKEN
          name: woowtech-secrets
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

backup:
  enabled: true
  name: pg-backup
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  restartPolicy: OnFailure
  labels:
    app.kubernetes.io/component: db-backup
    app.kubernetes.io/part-of: woowtech
  # Verbatim: the backup command is per-tenant.
  containers:
    - command:
      - sh
      - -c
      - "set -euo pipefail\nmkdir -p /backups\n# ── R-1：等待 postgres 可連通 ────────────────────────────────\n# 新 pod 啟動時 NetworkPolicy 的 iptables 規則尚未程式化完成，\n# 此期間封包被 REJECT（pg_dump 收到 Connection refused）→ 產生 0-byte dump。\n# 上限 60 秒（勿縮小：#279/#280 實測該空窗可達 20–30 秒）；逾時以非零碼退出。\ni=0\nuntil pg_isready -h woowtech-postgres-svc -U woow-odoo -q; do\n  i=$((i+1))\n  if [ \"$i\" -ge 60 ]; then\n    echo \"R-1: postgres 於 60 秒內無法連通，放棄本次備份\" >&2\n    exit 1\n  fi\n  sleep 1\ndone\necho \"R-1: postgres 於第 ${i} 秒可連通\"\n# ─────────────────────────────────────────────────────────────\nOUT=/backups/odoo_$(date +%Y%m%d_%H%M%S).pg\nPGPASSWORD=$POSTGRES_PASSWORD pg_dump -h woowtech-postgres-svc -U woow-odoo -d odoo -Fc -f \"$OUT\"\ntest -s \"$OUT\"\nls -lh \"$OUT\"\nls -t /backups/odoo_*.pg | tail -n +8 | xargs -r rm -f || true\n"
      env:
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            key: POSTGRES_PASSWORD
            name: woowtech-postgres-secret
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
      name: backup
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
      - mountPath: /backups
        name: backup
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: woowtech-backup-pvc
