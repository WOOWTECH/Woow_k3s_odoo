# Instance values for the torchmedia Odoo tenant on woow-k3s.
# Generated from the live objects: the render reproduces the running pod
# templates exactly, so adopting them restarts nothing.
#
# The init containers below are this tenant's own provisioning script,
# carried verbatim. Do not regenerate or 'tidy' them.
#
# SAFETY: never set `namespace:` here - placement is `-n` only.

tenant: torchmedia

odoo:
  containerName: odoo
  replicas: 1
  strategy: Recreate
  image: odoo@sha256:4ea9b4667921130add13c1b859aa170a4572b5c3c3d747bfb0ef152fdb0b48a7
  imagePullPolicy: IfNotPresent
  # IMMUTABLE on the live Deployment.
  selectorLabels:
    app.kubernetes.io/component: application
    app.kubernetes.io/name: torchmedia-odoo
  labels:
    app.kubernetes.io/component: application
    app.kubernetes.io/name: torchmedia-odoo
    app.kubernetes.io/part-of: torchmedia-odoo
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: '2026-06-19T15:32:01+08:00'
  nodeSelector:
    node-role.kubernetes.io/control-plane: 'true'
  podSecurityContext:
    fsGroup: 101
  # Verbatim - this tenant's provisioning script.
  initContainers:
    - command:
      - sh
      - -c
      - chown -R 101:101 /var/lib/odoo
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      name: fix-permissions
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsUser: 0
      volumeMounts:
      - mountPath: /var/lib/odoo
        name: odoo-filestore
    - command:
      - sh
      - -c
      - "echo \"Waiting for PostgreSQL...\"\nuntil nc -z torchmedia-postgres-svc 5432; do\n  echo \"  not ready - sleeping\"\n  sleep 2\ndone\necho \"PostgreSQL ready!\"\n"
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      name: wait-for-postgres
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
  command:
    - bash
    - -c
    - 'echo "Starting Odoo server..."
    
      exec odoo --config=/etc/odoo/odoo.conf
    
      '
  env:
    - name: HOST
      value: torchmedia-postgres-svc
    - name: PORT
      value: '5432'
    - name: USER
      valueFrom:
        secretKeyRef:
          key: POSTGRES_USER
          name: torchmedia-db-secret
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          key: POSTGRES_PASSWORD
          name: torchmedia-db-secret
  ports:
    - containerPort: 8069
      name: http
      protocol: TCP
    - containerPort: 8072
      name: longpolling
      protocol: TCP
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    initialDelaySeconds: 180
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 60
    httpGet:
      path: /web/health
      port: 8069
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  volumeMounts:
    - mountPath: /etc/odoo
      name: odoo-config
      readOnly: true
    - mountPath: /var/lib/odoo
      name: odoo-filestore
  # Verbatim: order is part of the pod template.
  volumes:
    - configMap:
        defaultMode: 420
        name: torchmedia-odoo-config
      name: odoo-config
    - name: odoo-filestore
      persistentVolumeClaim:
        claimName: torchmedia-filestore-pvc
    - configMap:
        defaultMode: 420
        name: torchmedia-nginx-config
      name: nginx-config
    - name: nginx-cache
      persistentVolumeClaim:
        claimName: torchmedia-nginx-cache-pvc
  service:
    type: ClusterIP
    labels:
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: torchmedia-odoo
    ports:
      - name: http
        port: 8069
        protocol: TCP
        targetPort: 8069
      - name: longpolling
        port: 8072
        protocol: TCP
        targetPort: 8072
      - name: nginx
        port: 8080
        protocol: TCP
        targetPort: 8080

nginx:
  enabled: true
  containerName: nginx
  image: nginx:1.27-alpine
  imagePullPolicy: IfNotPresent
  ports:
    - containerPort: 8080
      name: nginx-http
      protocol: TCP
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  volumeMounts:
    - mountPath: /etc/nginx/nginx.conf
      name: nginx-config
      readOnly: true
      subPath: nginx.conf
    - mountPath: /var/cache/nginx
      name: nginx-cache

postgres:
  enabled: true
  containerName: postgres
  replicas: 1
  strategy: Recreate
  image: pgvector/pgvector:pg17
  imagePullPolicy: IfNotPresent
  selectorLabels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: torchmedia-odoo
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: torchmedia-odoo
    app.kubernetes.io/part-of: torchmedia-odoo
  nodeSelector:
    node-role.kubernetes.io/control-plane: 'true'
  env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          key: POSTGRES_USER
          name: torchmedia-db-secret
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          key: POSTGRES_PASSWORD
          name: torchmedia-db-secret
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          key: POSTGRES_DB
          name: torchmedia-db-secret
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  ports:
    - containerPort: 5432
      name: postgres
      protocol: TCP
  livenessProbe:
    exec:
      command:
      - pg_isready
      - -U
      - odoo
      - -d
      - torchmedia
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command:
      - pg_isready
      - -U
      - odoo
      - -d
      - torchmedia
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3
  resources:
    limits:
      cpu: '1'
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: postgres-data
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: torchmedia-db-pvc
  service:
    type: ClusterIP
    labels:
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: torchmedia-odoo
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
        targetPort: 5432

tunnel:
  enabled: true
  containerName: cloudflared
  replicas: 1
  image: cloudflare/cloudflared:latest
  imagePullPolicy: IfNotPresent
  selectorLabels:
    app.kubernetes.io/component: cloudflared
    app.kubernetes.io/name: torchmedia
  labels:
    app.kubernetes.io/component: cloudflared
    app.kubernetes.io/name: torchmedia
    app.kubernetes.io/part-of: torchmedia
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: '2026-06-26T15:56:05+08:00'
  nodeSelector:
    node-role.kubernetes.io/control-plane: 'true'
  strategy:
    type: Recreate
  args:
    - tunnel
    - --no-autoupdate
    - --metrics
    - 0.0.0.0:2000
    - run
    - --token
    - $(TUNNEL_TOKEN)
  env:
    - name: TUNNEL_TOKEN
      valueFrom:
        secretKeyRef:
          key: TUNNEL_TOKEN
          name: torchmedia-cf-tunnel
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sh
        - -c
        - sleep 5
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

backup:
  enabled: true
  name: pg-backup
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  restartPolicy: OnFailure
  labels:
    app.kubernetes.io/component: db-backup
    app.kubernetes.io/part-of: torchmedia
  # Verbatim: the backup command is per-tenant.
  containers:
    - command:
      - sh
      - -c
      - "set -euo pipefail\nmkdir -p /backups\n# ── R-1：等待 postgres 可連通 ────────────────────────────────\n# 新 pod 啟動時 NetworkPolicy 的 iptables 規則尚未程式化完成，\n# 此期間封包被 REJECT（pg_dump 收到 Connection refused）→ 產生 0-byte dump。\n# 上限 60 秒（勿縮小：#279/#280 實測該空窗可達 20–30 秒）；逾時以非零碼退出。\ni=0\nuntil pg_isready -h torchmedia-postgres-svc -U \"$POSTGRES_USER\" -q; do\n  i=$((i+1))\n  if [ \"$i\" -ge 60 ]; then\n    echo \"R-1: postgres 於 60 秒內無法連通，放棄本次備份\" >&2\n    exit 1\n  fi\n  sleep 1\ndone\necho \"R-1: postgres 於第 ${i} 秒可連通\"\n# ─────────────────────────────────────────────────────────────\nOUT=/backups/odoo_$(date +%Y%m%d_%H%M%S).pg\nPGPASSWORD=$POSTGRES_PASSWORD pg_dump -h torchmedia-postgres-svc -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -Fc -f \"$OUT\"\ntest -s \"$OUT\"\nls -lh \"$OUT\"\nls -t /backups/odoo_*.pg | tail -n +8 | xargs -r rm -f || true\n"
      env:
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            key: POSTGRES_PASSWORD
            name: torchmedia-db-secret
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            key: POSTGRES_USER
            name: torchmedia-db-secret
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            key: POSTGRES_DB
            name: torchmedia-db-secret
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
      name: backup
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
      - mountPath: /backups
        name: backup
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: torchmedia-backup-pvc
