# Substituted into any init container script containing __PGPASSWORD__ (see
# templates/odoo-deployment.yaml). Must stay empty here: the real value is
# passed with --set-string at install time, never committed.
pgPassword: ""

# Defaults for the odoo-tenant chart.
#
# This chart reproduces Odoo tenants that were applied by hand with kubectl.
# They are NOT one shape - see the comment in templates/odoo-deployment.yaml -
# so most of a tenant's pod spec arrives here as data rather than being derived.
# An instance values file is therefore long. That is honest: the length is the
# tenant's own provisioning logic, not chart boilerplate.
#
# For a FRESH Odoo install use ../odoo instead. This chart exists to adopt what
# is already running.

namespace:
  create: false
  # EMPTY so `-n` alone controls placement. A non-empty value here silently
  # overrides `-n`, which is how a rehearsal once wrote Helm ownership
  # annotations onto a live production Deployment.
  name: ""

# Prefix every derived name comes from: <tenant>-odoo, <tenant>-postgres,
# <tenant>-cloudflared, <tenant>-odoo-svc, <tenant>-postgres-svc.
# Every one of those can still be overridden below, because the live names do
# not all follow the rule.
tenant: ""

odoo:
  # Overrides the derived `<tenant>-odoo`. One tenant's Deployment is just
  # `odoo`, with no prefix at all.
  name: ""
  containerName: odoo
  replicas: 1
  # Recreate everywhere live: the data volume is ReadWriteOnce, and a rolling
  # update would surge a pod that waits forever for a volume the old one holds.
  strategy: Recreate
  image: odoo:18.0
  imagePullPolicy: IfNotPresent
  # Selector labels. IMMUTABLE on a live Deployment - must match what runs.
  selectorLabels: {}
  labels: {}
  podExtraLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  podSecurityContext: {}
  automountServiceAccountToken: null
  # One tenant pins a hostname and a DNS search path on the pod.
  hostAliases: []
  dnsConfig: {}
  # Carried VERBATIM from the live pod - this is the tenant's own provisioning
  # script, not something to regenerate. See templates/odoo-deployment.yaml.
  initContainers: []
  command: []
  env: []
  # Environment variables read from Secrets, per Odoo component. Each entry is
  #   {name: <ENV_NAME>, secretName: <Secret>, key: <key in it>}  (+ optional: true)
  # and renders as valueFrom.secretKeyRef after `env` above - never as a literal,
  # so a credential cannot be committed through these lists (any other field is
  # refused, and so is a name already set in the same container).
  secretEnv:
    # Every Odoo container this chart renders: the web pod, and the cron pod
    # when cron.enabled.
    both: []
    # The web container only.
    web: []
    # The cron container only. Refused unless cron.enabled: without the cron
    # Deployment these would reach no pod.
    cron: []
  ports: []
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  resources: {}
  volumeMounts: []
  # Verbatim: which volumes exist, what backs them and their ORDER are all part
  # of the pod template.
  volumes: []
  service:
    name: ""
    type: ClusterIP
    labels: {}
    ports: []
  # Separate cron Deployment. OFF: every tenant runs its crons inside the web
  # pod, and with this off nothing about any tenant's render changes. On, it
  # adds Deployment <odoo name>-cron (no Service) that runs only Odoo's cron
  # threads, so a credential that only cron jobs use (odoo.secretEnv.cron)
  # never sits in the web pod. See README "Separate cron Deployment" before
  # turning it on: the switch restarts the web pod and changes how Odoo is
  # stopped (both Deployments, not one).
  cron:
    enabled: false
    # Overrides the derived `<odoo name>-cron`.
    name: ""
    # 0 or 1. One cron pod per tenant; to scale cron work, raise maxCronThreads.
    replicas: 1
    # The same odoo.conf the web reads, at this path inside the container.
    configPath: /etc/odoo/odoo.conf
    # Rendered as `odoo --config=<configPath> --workers=0 --max-cron-threads=N
    # [--db_maxconn=M] [--no-http] <extraArgs...>` (threaded mode: one process,
    # N cron threads). The web's own odoo.command must pass
    # --max-cron-threads=0 to the odoo it runs; the render fails if it does not.
    # With the split off, the render fails if the web command passes 0 (no pod
    # would run crons), and an upgrade fails while this release still runs a
    # cron Deployment with replicas > 0 (README "Separate cron Deployment").
    maxCronThreads: 3
    # Database pool of the cron process. null keeps odoo.conf's db_maxconn.
    # Must be >= 3 x maxCronThreads: each threaded cron thread holds a LISTEN
    # connection plus cron_cr and job_cr from the same pool.
    dbMaxconn: null
    # true: no HTTP server in the cron pod (its probes then cannot use httpGet).
    noHttp: false
    # Appended to the odoo command line verbatim, one flag per entry. A cron
    # pod that keeps its HTTP server for health checks but must not take
    # connections from other pods uses --http-interface=127.0.0.1 here, with
    # exec probes (README "Separate cron Deployment").
    extraArgs: []
    # Verbatim, like odoo.initContainers, but NOT inherited from them: those are
    # each tenant's provisioning scripts and must not run twice.
    initContainers: []
    # [] = mount exactly what the web's odoo container mounts (odoo.volumeMounts).
    # The pod gets only the odoo.volumes entries these mounts (and the cron init
    # containers' mounts) name - the nginx sidecar's volumes stay out.
    volumeMounts: []
    podAnnotations: {}
    livenessProbe: {}
    readinessProbe: {}
    startupProbe: {}
    resources: {}

# The nginx sidecar that fronts Odoo in the same pod. Every live tenant has one.
nginx:
  enabled: true
  containerName: nginx
  image: nginx:1.27-alpine
  imagePullPolicy: IfNotPresent
  env: []
  ports: []
  livenessProbe: {}
  readinessProbe: {}
  resources: {}
  volumeMounts: []

postgres:
  enabled: true
  # Overrides the derived `<tenant>-postgres`.
  name: ""
  containerName: postgres
  replicas: 1
  strategy: Recreate
  image: postgres:16-alpine
  imagePullPolicy: IfNotPresent
  selectorLabels: {}
  labels: {}
  podExtraLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  podSecurityContext: {}
  automountServiceAccountToken: null
  env: []
  ports: []
  livenessProbe: {}
  readinessProbe: {}
  resources: {}
  volumeMounts: []
  volumes: []
  service:
    name: ""
    type: ClusterIP
    labels: {}
    ports: []

tunnel:
  enabled: true
  # Overrides the derived `<tenant>-cloudflared`. One tenant's tunnel is named
  # after a different project entirely.
  name: ""
  containerName: cloudflared
  replicas: 1
  image: cloudflare/cloudflared:latest
  imagePullPolicy: Always
  selectorLabels: {}
  labels: {}
  podExtraLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  strategy: {}
  # The token lives in here, either as a secretKeyRef in `env` or as the last
  # `--token` argument. NEVER commit a plain one - pass it with --set-string.
  args: []
  env: []
  lifecycle: {}
  livenessProbe: {}
  readinessProbe: {}
  resources: {}

# Additional Cloudflare tunnels beyond `tunnel` above. One tenant runs two
# independent ones in the same namespace - see templates/cloudflared-extra.yaml.
# Each entry takes the same keys as `tunnel`.
extraTunnels: []

backup:
  # Three tenants had none at all until 2026-09-15.
  enabled: true
  persistence:
    # true renders the claim the dumps are written to. Tenants that already had
    # a backup volume leave this false and name the existing claim below.
    create: false
    claimName: ""
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 20Gi
    # Dumps must survive `helm uninstall`.
    keep: true
  name: pg-backup
  schedule: "0 2 * * *"
  concurrencyPolicy: ""
  successfulJobsHistoryLimit: null
  failedJobsHistoryLimit: null
  backoffLimit: null
  # Skip a run the controller missed by more than this, rather than firing late.
  startingDeadlineSeconds: 600
  # Kill a dump that hangs instead of letting it run into the next one.
  activeDeadlineSeconds: 1800
  # Reap finished Jobs after a day.
  ttlSecondsAfterFinished: 86400
  restartPolicy: OnFailure
  labels: {}
  nodeSelector: {}
  # Verbatim, like the init containers: the backup command is per-tenant.
  containers: []
  volumes: []
