{{- if .Values.backup.enabled }}
{{- /*
Nightly pg_dump.

Three tenants had NO backup at all until 2026-09-15 - not a broken schedule, no
CronJob and no volume to write to. `backup.persistence.create` renders the claim
for them; tenants that already had one leave it false and name the existing claim.

The dump script must wait for PostgreSQL to answer before running pg_dump. That
is not defensive padding: where a NetworkPolicy is in force, a freshly scheduled
pod can have its packets REJECTed for 20-30s while iptables rules are still
being programmed, and pg_dump then writes a 0-byte file and exits 0. The guard
plus `test -s` is what turns that into a loud failure instead of a silent one.
*/ -}}
{{- if .Values.backup.persistence.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.backup.persistence.claimName }}
  namespace: {{ include "odoo-tenant.ns" . }}
  {{- if .Values.backup.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.backup.persistence.accessMode }}
  storageClassName: {{ .Values.backup.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.backup.name }}
  namespace: {{ include "odoo-tenant.ns" . }}
  {{- with .Values.backup.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- /*
  These three are easy to lose and worth keeping. startingDeadlineSeconds skips
  a run that the controller missed by more than its window instead of firing it
  late; activeDeadlineSeconds kills a dump that hangs rather than letting it run
  until the next one; ttlSecondsAfterFinished reaps finished Jobs. Every live
  tenant that had a backup carried all three, and the chart did not describe
  them - so a CronJob recreated from the chart alone would have come back
  without them.
  */}}
  {{- with .Values.backup.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.backup.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.backup.successfulJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.backup.failedJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      {{- with .Values.backup.backoffLimit }}
      backoffLimit: {{ . }}
      {{- end }}
      {{- with .Values.backup.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with .Values.backup.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        spec:
          restartPolicy: {{ .Values.backup.restartPolicy }}
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.containers }}
          containers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
