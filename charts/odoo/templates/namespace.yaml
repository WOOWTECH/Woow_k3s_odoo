{{- /*
A Namespace equal to the release namespace (-n) is never rendered: Helm keeps
its release record there, so it must be created with --create-namespace
instead, and can never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne (include "odoo.ns" .) .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "odoo.ns" . }}
  labels:
    app: odoo
    managed-by: helm
  {{- include "odoo.keepAnnotations" . | nindent 2 }}
{{- end }}
