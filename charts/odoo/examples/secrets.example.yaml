# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_odoo - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references these
# two Secrets by name. Copy this file OUTSIDE the repo, replace every
# REPLACE_ME value, adjust the namespace to your values.namespace.name, then
# apply that copy:
#   kubectl --context <ctx> apply -f /secure/path/secrets.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: odoo-db-secret
  namespace: odoo
  labels:
    app: odoo
    component: database
type: Opaque
stringData:
  POSTGRES_USER: "odoo"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  POSTGRES_DB: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: odoo-secrets
  namespace: odoo
  labels:
    app: odoo
    component: web
type: Opaque
stringData:
  # Odoo's database-manager master password (odoo.conf's admin_passwd).
  # Protects /web/database/manager: creating, duplicating, backing up and
  # dropping databases. An initContainer appends
  # "admin_passwd = <this value>" to odoo.conf at pod start; it is never
  # written to a ConfigMap. Avoid a literal "%" in the value (Odoo's config
  # parser treats it as an interpolation character) and avoid newlines.
  ADMIN_PASSWD: "REPLACE_ME_ADMIN_PASSWD"
