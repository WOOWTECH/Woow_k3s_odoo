# Default values for the odoo chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace odoo, NodePort 31806, local-path storage, StatefulSet postgres),
# except that secrets no longer ship with real-looking placeholder values and
# odoo.conf no longer carries admin_passwd (see `secrets` below).

namespace:
  # Render the Namespace object. A namespace equal to the release namespace
  # (`-n`) is never rendered - create it with --create-namespace instead - so
  # `helm uninstall` can never delete the namespace the release lives in.
  create: true
  name: odoo

# Add `helm.sh/resource-policy: keep` to the Namespace, every PVC and any
# Secret this chart renders, so `helm uninstall` never deletes the database,
# the filestore or the admin password.
keepOnUninstall: true

odoo:
  image:
    repository: odoo
    tag: "18"
    # Explicit; the original manifests did not set pullPolicy on the
    # ":18" tag, so Kubernetes defaults to IfNotPresent. Change to
    # "Always" if you switch tag to :latest.
    pullPolicy: IfNotPresent

  # Injected into the odoo container via a ConfigMap.
  # HOST/PORT are exposed as env vars; odoo.conf is combined with the
  # ADMIN_PASSWD Secret key by an initContainer and mounted into
  # /etc/odoo/odoo.conf (see templates/odoo-deployment.yaml). This ConfigMap
  # therefore does NOT contain admin_passwd - it lives in a Secret only.
  config:
    HOST: db
    PORT: "5432"
    odoo.conf: |
      [options]
      ; Odoo 18 Configuration File

      ; Addons path
      addons_path = /mnt/extra-addons

      ; Database settings (injected via environment variables)
      ; db_host = db
      ; db_port = 5432
      ; db_user = odoo
      ; db_password =

      ; admin_passwd is intentionally NOT set here. An initContainer appends
      ; "admin_passwd = <value from Secret odoo-secrets key ADMIN_PASSWD>"
      ; to this file before Odoo starts, so the password never sits in a
      ; ConfigMap. Do not add an admin_passwd line here - it would be
      ; overridden (the appended line wins with Odoo's config parser).

      ; Logging
      log_level = info

      ; Performance tuning
      workers = 0
      max_cron_threads = 1
      limit_memory_hard = 2684354560
      limit_memory_soft = 2147483648
      limit_time_cpu = 600
      limit_time_real = 1200

      ; Proxy mode (set to True if behind reverse proxy)
      proxy_mode = False

  service:
    type: NodePort
    port: 8069
    # Only used when type is NodePort.
    nodePort: 31806

  persistence:
    # PVC for odoo filestore (/var/lib/odoo).
    data:
      storageClassName: local-path
      size: 10Gi
    # PVC for custom addons (/mnt/extra-addons).
    addons:
      storageClassName: local-path
      size: 5Gi
    # PVC for odoo configuration (currently unused by the deployment;
    # kept for parity with the original manifests).
    config:
      storageClassName: local-path
      size: 100Mi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # The official odoo:18 image runs as a fixed non-root user (uid 100, gid
  # 101) and does not chown its volumes on startup (unlike the postgres
  # image, which does). local-path-provisioner happens to create volumes
  # world-writable, which hid this; StorageClasses that create root-owned
  # volumes (e.g. Longhorn) do not, and Odoo fails with "Permission denied"
  # on /var/lib/odoo. fsGroup makes every mounted volume group-writable by
  # gid 101 regardless of the StorageClass.
  podSecurityContext:
    fsGroup: 101

  # Also used for the `helm test` smoke pod (it only needs sh/cat).
  initContainer:
    image: busybox:1.36

postgres:
  image:
    repository: pgvector/pgvector
    tag: pg16
    # Explicit; the original manifests did not set pullPolicy on a
    # non-":latest" tag, so Kubernetes defaults to IfNotPresent.
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  persistence:
    # PVC for postgres data (/var/lib/postgresql/data via subPath pgdata).
    storageClassName: local-path
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Two Secrets, referenced by name by the Deployment/StatefulSet:
#   odoo-db-secret: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   odoo-secrets:   ADMIN_PASSWD (Odoo's database-manager master password)
#
# create: false (default) - the Secrets already exist (created from
#   examples/secrets.example.yaml) and the chart never renders them, so a
#   `helm upgrade` can never overwrite a real password with an empty value.
# create: true - render both Secrets from the values below. postgresPassword
#   and adminPasswd are required() and MUST be set (no default, no
#   placeholder) - fresh installs and tests only.
secrets:
  create: false
  # -- PostgreSQL role used by odoo. Not a secret by itself, but it lives in
  #    the Secret alongside the password for a single source of DB config.
  postgresUser: "odoo"
  # -- PostgreSQL password. Required when secrets.create=true; no default.
  postgresPassword: ""
  # -- Default database name.
  postgresDb: "postgres"
  # -- Odoo database-manager master password (odoo.conf's admin_passwd).
  #    Required when secrets.create=true; no default.
  adminPasswd: ""

tests:
  # `helm test` smoke pod: GET /web/login, then create a throwaway database
  # through /web/database/create using ADMIN_PASSWD, and confirm it appears
  # in /web/database/selector. Read-only towards everything except that one
  # disposable database.
  enabled: true
